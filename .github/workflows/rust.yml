name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # 実行するOSのリストを定義します
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    # matrixで定義した各OSを使用します
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    # Rustツールチェーンのセットアップ（OSごとの差異を吸収しやすくなります）
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build
      run: cargo build --verbose
      
    - name: Run tests
      run: cargo test --verbose
