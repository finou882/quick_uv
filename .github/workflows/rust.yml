name: Rust Release

on:
  push:
    tags:
      - 'v*' # v1.0.0 のようなタグがプッシュされた時に発火
    branches: [ "main" ] # メインへのプッシュでもビルド確認のため実行
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: your_project_name # <--- ここに自分の実行ファイル名を記入！

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build
      run: cargo build --release --verbose # リリースモードでビルド

    - name: Run tests
      run: cargo test --verbose

    # --- ここから自動リリースのためのステップ ---
    
    - name: Package Binary (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd target/release
        powershell Compress-Archive -Path "${{ env.BIN_NAME }}.exe" -DestinationPath "../../${{ env.BIN_NAME }}-windows.zip"

    - name: Package Binary (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd target/release
        tar -czvf "../../${{ env.BIN_NAME }}-${{ matrix.os }}.tar.gz" "${{ env.BIN_NAME }}"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-binaries
        path: ${{ env.BIN_NAME }}-*

  # 全OSのビルドが終わった後に1回だけ実行されるリリースジョブ
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') # タグ打ちされた時のみ実行
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "**/${{ env.BIN_NAME }}-*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
